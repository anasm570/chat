<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>🔍 بوت ويكيبيديا</title>
    <style>
        body { background: #0f172a; font-family: 'Segoe UI', sans-serif; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; }
        .chat { width: 100%; max-width: 600px; background: #1e293b; border-radius: 32px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #messages { height: 400px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #334155; border-radius: 20px; padding: 10px; }
        .user { text-align: right; color: #a5f3fc; margin: 8px; }
        .bot { text-align: left; color: #facc15; margin: 8px; }
        input, button { padding: 10px; border-radius: 40px; border: none; margin-top: 5px; }
        input { width: 75%; background: #0f172a; color: white; }
        button { width: 20%; background: #f97316; color: white; cursor: pointer; }
    </style>
</head>
<body>
<div class="chat">
    <h2>🔍 بوت جوجل + ويكيبيديا</h2>
    <div id="messages"><div class="bot">مرحباً! اسألني أي شيء.</div></div>
    <input type="text" id="question" placeholder="اكتب سؤالك...">
    <button onclick="ask()">أرسل</button>
</div>
<script>
    async function ask() {
        let q = document.getElementById('question').value.trim();
        if (!q) return;
        let messages = document.getElementById('messages');
        messages.innerHTML += `<div class="user">${q}</div>`;
        document.getElementById('question').value = '';
        messages.innerHTML += `<div class="bot">🔍 جاري البحث...</div>`;
        try {
            let res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            let data = await res.json();
            let answer = data.answer || 'لم أجد إجابة.';
            messages.lastChild.remove();
            messages.innerHTML += `<div class="bot">${answer}</div>`;
        } catch(e) {
            messages.lastChild.remove();
            messages.innerHTML += `<div class="bot">⚠️ خطأ في الاتصال بالخادم.</div>`;
        }
        messages.scrollTop = messages.scrollHeight;
    }
</script>
</body>
</html>
